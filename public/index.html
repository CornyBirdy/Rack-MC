<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1c1f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MC Hoster" />
    <title>MC Hoster — Minecraft Server Panel</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>
      // Dark unless this browser picked light (⚙ sidebar → Theme); set before
      // the stylesheet paints so a light page never flashes dark.
      try { if (localStorage.getItem("theme") === "light") document.documentElement.dataset.theme = "light"; } catch (e) {}
    </script>
    <link rel="stylesheet" href="/style.css" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <button class="tb-menu" id="tb-menu" aria-label="Menu"><span class="ic" data-ico="menu"></span></button>
        <div class="tb-title" id="tb-title">MC&nbsp;Hoster</div>
        <span class="tb-sum" id="tb-sum"></span>
      </header>
      <div class="scrim" id="scrim"></div>
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark" id="brand-mark"></div>
          <div class="brand-text">
            <strong>MC&nbsp;Hoster</strong>
            <span>server control panel</span>
          </div>
        </div>

        <button class="btn btn-primary btn-block" id="nav-create">
<span class="ic" data-ico="plus"></span> Create Server
        </button>

        <nav class="nav">
          <a href="#/" class="nav-item" data-route="dashboard"><span class="ic" data-ico="grid"></span> Dashboard</a>
        </nav>

        <div class="server-list-label">Your Servers</div>
        <div class="server-list" id="server-list"></div>

        <div class="sidebar-foot">
          <div class="sysmon" id="sysmon" title="Host resource usage"></div>
          <button class="nav-item" id="nav-settings"><span class="ic" data-ico="gear"></span> Settings</button>
          <button class="nav-item" id="nav-theme" title="Switch between the dark and light theme"><span class="ic" data-ico="moon"></span> <span id="nav-theme-label">Theme: dark</span></button>

          <div class="java-chip" id="java-chip" title="Java runtime status"></div>
          <div class="java-chip" id="playit-chip" title="playit.gg tunnel status" style="display:none"></div>
        </div>
      </aside>

      <main class="main">
        <div id="view"></div>
      </main>
    </div>

    <button class="build-badge" id="build-badge" title="What's new — click for the changelog" hidden></button>
    <div id="modal-root"></div>
    <div id="toast-root"></div>

    <script src="/icons.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
